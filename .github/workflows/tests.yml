name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case: [
          "test_is_7zip_installed",
          "test_alt_chars_candidates_generator",
          "test_7z_archives_extracted_via_fiddlesticks_CLI",
        ]
    steps:
    - name: Check out repo
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    
    - name: Install dependencies
      run: |
        pip install -e .[tests,py7zr]
    
    - name: Run PyTest
      run: |
        pytest -k ${{ matrix.test-case }}