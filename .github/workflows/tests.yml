name: Run the tests

on:
  workflow_dispatch:
  push:
  pull_request:



jobs:
  tests:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/hazardous-area/fiddlesticks/test_env:sha-f1100e7
      # Extra options needed for Veracrypt to 
      # mount volumes inside a Docker container
      options: >-
        --device /dev/fuse
        --cap-add SYS_ADMIN
        --security-opt apparmor:unconfined
        --privileged
        -v /dev:/dev
    steps:
    - name: Check out repo
      uses: actions/checkout@v7

    - name: Install code under test
      run: |
        . /fiddlesticks/.venv/bin/activate
        pip install -e .[all]


    - name: Run PyTest (via Coverage)
      run: |
        . /fiddlesticks/.venv/bin/activate
        coverage run -m pytest -rA --tb=short tests && coverage combine && coverage report


