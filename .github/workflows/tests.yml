name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case: [
          "test_is_7zip_installed",
          "test_alt_chars_candidates_generator",
          "test_7z_archives_extracted_via_fiddlesticks_CLI",
          "test_piping_candidates_to_stdout",
        ]
    steps:
    - name: Check out repo
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    
    - name: Install dependencies
      run: |
        pip install -e .[tests,py7zr]

    - name: Get external test data
      uses: actions/checkout@v7
      with:
        repository: Sammy-T/avdu/
        ref: a7d5f12318ede0a016b0560b93d3ec1a7a22dda7 # First commit
        path: avdu

    - name: Run PyTest
      run: |
        pytest -k ${{ matrix.test-case }}