name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:26.04
      options: >-
        --device /dev/fuse
        --cap-add SYS_ADMIN
        --security-opt apparmor:unconfined
        --privileged
        -v /dev:/dev
    steps:
    - name: Check out repo
      uses: actions/checkout@v7
    

    - name: Check Git hasn't corrupted test data files
      run: |
        sha256sum tests/data_files/Test_vault_Do_Not_Use.kdbx

    - name: Install deps
      run: |
        apt-get update
        apt-get install -y sudo wget git 7zip python3-venv python3-pip python-is-python3


    - name: Direct Install libfuse3-4
      run: |
        sudo apt-get update && sudo apt-get install -y wget
        wget http://archive.ubuntu.com/ubuntu/pool/main/f/fuse3/libfuse3-4_3.18.2-1_amd64.deb
        sudo dpkg -i libfuse3-4_3.18.2-1_amd64.deb || sudo apt-get install -f -y

    - name: Download Veracrypt .deb
      run: wget https://github.com/veracrypt/VeraCrypt/releases/download/VeraCrypt_1.26.29/veracrypt-console-1.26.29-Ubuntu-26.04-amd64.deb
 
    - name: Install Veracrypt from downloaded .deb
      run: |
        sudo apt update
        sudo apt install -y software-properties-common
        sudo add-apt-repository universe
        sudo apt-get update 
        # Suggests fuse3
        sudo apt-get install -y fuse3 libfuse3-dev
        sudo apt-get install -y ./veracrypt-console-1.26.29-Ubuntu-26.04-amd64.deb  

    # - name: Create volume
    #   run: |
    #     python ./tests/veracrypt/create.py

    # - name: Create Mount point
    #   run: mkdir -p ./mnt/vc

    # - name: Mount volume from Bash
    #   run: >
    #     sudo
    #     veracrypt
    #     --text
    #     --password="test"
    #     --non-interactive
    #     --keyfiles=""
    #     --pim=0
    #     --protect-hidden=no
    #     --mount
    #     test.hc
    #     ./mnt/vc

    # - name: Unmount volume from Bash
    #   run: veracrypt --unmount


    # - name: Mount volume
    #   run: |
    #     python ./tests/veracrypt/mount.py


    - name: Create venv
      run: |
        python3 -m venv .venv

    - name: Install dependencies
      run: |
        . ./.venv/bin/activate
        # Test main branch via PyPi, so we don't need to keep fiddlesticks.py updaed on this branch
        pip install fiddlesticks --group=test

    - name: Run PyTest (via Coverage)
      run: |
        . ./.venv/bin/activate
        coverage run -m pytest -rA -vv --tb=short tests && coverage combine && coverage report
